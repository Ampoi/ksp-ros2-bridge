laser_scan_odometry:
  ros__parameters:
    filtered_scan_topic: /ksp_nav2/scan
    odom_topic: /ksp_nav2/odom
    odom_frame: lidar_odom
    base_frame: nav_base_link
    max_points: 720
    max_iterations: 20
    max_correspondence_distance: 2.0
    trim_fraction: 0.8
    minimum_correspondences: 20
    convergence_tolerance: 0.0001
    max_rmse: 0.5
    max_translation_per_scan: 2.0
    max_rotation_per_scan: 0.5

planar_wrench_controller:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    odom_topic: /ksp_nav2/odom
    wrench_command_topic: /ksp_vessel/control/wrench_command
    authority_command_topic: /ksp_vessel/control/authority/command
    authority_state_topic: /ksp_vessel/control/authority/state
    vessel_lifecycle_topic: /ksp_vessel/lifecycle
    controller_id: nav2_planar_controller
    control_priority: 80
    lease_duration_sec: 2.0
    lease_renew_period_sec: 0.5
    suppress_sas: true
    wrench_timeout_sec: 0.25
    odom_base_frame: nav_base_link
    wrench_frame: base_link
    # LiDAR +X relative to vessel base_link +X. Set radians if not aligned.
    nav_to_body_yaw: 0.0
    control_rate: 20.0
    linear_gain: 1000.0
    angular_gain: 1000.0
    max_planar_force: 10000.0
    max_yaw_torque: 10000.0
    command_timeout: 0.5
    odom_timeout: 0.25
    brake_duration: 0.5

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: nav_base_link
    odom_frame_id: lidar_odom
    global_frame_id: map
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 0.5
    robot_model_type: nav2_amcl::OmniMotionModel
    min_particles: 500
    max_particles: 2000
    max_beams: 120
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: nav_base_link
    odom_topic: /ksp_nav2/odom
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /ksp_nav2/odom
    controller_frequency: 10.0
    failure_tolerance: 0.5
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.35
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.5
      min_vel_y: -0.5
      max_vel_x: 2.0
      max_vel_y: 2.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 2.0
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 1.0
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 10
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.10
      angular_granularity: 0.05
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.5
      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.5
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: lidar_odom
    global_frame: map
    robot_base_frame: nav_base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: lidar_odom
      robot_base_frame: nav_base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.10
      robot_radius: 1.0
      transform_tolerance: 0.5
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 80.0
          raytrace_max_range: 100.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.5
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: nav_base_link
      resolution: 0.10
      robot_radius: 1.0
      track_unknown_space: true
      transform_tolerance: 0.5
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 80.0
          raytrace_max_range: 100.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.5
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
