debris_orbit:
  ros__parameters:
    # 誤作動防止のため、launch時に enabled:=true を明示する。
    enabled: false

    # 機体・搭載センサーとの紐付け。VAB/SPHで設定したSensor IDに合わせる。
    # デモ出力のnamespace。KSP機体を選択するIDではない。
    demo_instance_id: demo_vehicle
    lidar_sensor_id: front_lidar
    camera_sensor_id: orbit_camera
    vessel_topic_prefix: /ksp_vessel

    # 個別Topicを空以外にするとvessel_topic_prefixからの自動解決より優先する。
    lidar_topic: ""
    camera_topic: ""
    pose_topic: ""
    twist_topic: ""
    setpoint_topic: ""
    status_topic: ""
    world_frame: ground_truth_enu
    body_frame: base_link

    # 周回軌道。orbit_directionは+1/-1、normalはworld_frame基準。
    orbit_radius: 15.0
    angular_speed_deg_s: 3.0
    orbit_direction: 1
    orbit_plane_normal: [0.0, 0.0, 1.0]

    # 高速回転中は目標指向を行わず、デタンブル指令を先に出す。
    detumble_enter_rate_deg_s: 6.0
    detumble_exit_rate_deg_s: 2.0

    # 対象喪失時は最後の視線を中心に、小角度の周期スキャンを行う。
    # sin波で必ず往復するため、一方向へ回転し続けない。
    search_start_delay_sec: 0.3
    search_yaw_amplitude_deg: 8.0
    search_pitch_amplitude_deg: 4.0
    search_period_sec: 8.0
    search_memory_timeout_sec: 10.0
    # 円周へ収束し、この条件を満たした時点を撮影角0度とする。
    arrival_position_tolerance: 0.75
    arrival_speed_tolerance: 0.25
    arrival_attitude_tolerance_deg: 5.0

    # 3D LiDAR点群のデブリ抽出・追跡。
    cluster_tolerance: 1.5
    cluster_min_points: 8
    voxel_size: 0.35
    max_points: 4000
    min_target_range: 1.0
    max_target_range: 150.0
    target_cluster_index: 0
    target_max_jump: 8.0
    target_filter_alpha: 0.25
    target_velocity_filter_alpha: 0.35
    # 単発の誤検出では作動せず、連続した有効点群を確認してから制御する。
    target_acquisition_samples: 3
    # LiDARが見ている表面から物体中心方向（視線の奥）への補正量[m]。
    target_center_offset: 0.0
    state_timeout_sec: 0.5
    target_timeout_sec: 1.0
    # PointCloud2より遅れて到着する同時刻TFを非同期キューで待つ。
    transform_wait_timeout_sec: 1.0
    transform_retry_rate_hz: 50.0
    cloud_queue_size: 20
    control_rate_hz: 20.0

    # 0, 30, ... 330度で12枚を保存する。
    capture_step_deg: 30.0
    capture_count: 12
    capture_tolerance_deg: 2.0
    stop_after_capture: true
    output_directory: debris_orbit_captures

debris_orbit_controller:
  ros__parameters:
    # 共通制御パッケージ。lifecycleのvessel_idへleaseを取得してから指令する。
    controller_id: debris_orbit_demo
    vessel_topic_prefix: /ksp_vessel
    pose_topic: ""
    twist_topic: ""
    setpoint_topic: ""
    wrench_command_topic: ""
    authority_command_topic: ""
    authority_state_topic: ""
    vessel_lifecycle_topic: ""
    controller_status_topic: ""
    world_frame: ground_truth_enu
    body_frame: base_link

    control_priority: 100
    lease_duration_sec: 2.0
    lease_renew_period_sec: 0.5
    suppress_sas: true
    command_timeout_sec: 0.25

    # 機体ごとに調整するPDゲインとリミット（N, N*m）。
    position_kp: 5.0
    velocity_kd: 20.0
    attitude_kp: 80.0
    angular_kd: 400.0
    max_force: 20.0
    max_torque: 2.0
    # 探索・対象取得中の姿勢保持は低トルクに制限する。
    attitude_hold_max_torque: 0.5
    # この角速度を超えると姿勢誤差より制動を優先する。
    attitude_hold_rate_limit_deg_s: 2.5
    detumble_kd: 20.0
    detumble_max_torque: 1.0
    command_ramp_sec: 3.0
    state_timeout_sec: 0.5
    setpoint_timeout_sec: 0.5
    control_rate_hz: 20.0
