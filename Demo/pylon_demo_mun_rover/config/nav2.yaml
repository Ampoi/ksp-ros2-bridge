/pylon/mun_rover/bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: pylon_rover_base_footprint
    odom_topic: /pylon/mun_rover/odom
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
/pylon/mun_rover/planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      tolerance: 0.5
      allow_unknown: false
      downsample_costmap: false
      minimum_turning_radius: 20.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 100.0
      smooth_path: true
/pylon/mun_rover/controller_server:
  ros__parameters:
    odom_topic: /pylon/mun_rover/odom
    controller_frequency: 10.0
    failure_tolerance: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.25
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.6
      yaw_goal_tolerance: 0.2
      stateful: true
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.05
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.5
      lookahead_dist: 1.5
      min_lookahead_dist: 1.0
      max_lookahead_dist: 3.0
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      use_rotate_to_heading: false
      allow_reversing: false
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 2.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 4.0
      regulated_linear_scaling_min_speed: 0.03
      use_cost_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 2.0
/pylon/mun_rover/global_costmap/global_costmap:
  ros__parameters:
    global_frame: map
    robot_base_frame: pylon_rover_base_footprint
    update_frequency: 3.0
    publish_frequency: 2.0
    rolling_window: false
    resolution: 0.25
    robot_radius: 6.0
    footprint_padding: 0.0
    transform_tolerance: 0.5
    track_unknown_space: true
    always_send_full_costmap: true
    plugins:
    - static_layer
    - inflation_layer
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /pylon/mun_rover/map
      map_subscribe_transient_local: true
      subscribe_to_updates: false
      track_unknown_space: true
      trinary_costmap: true
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 10.0
      cost_scaling_factor: 2.0
      inflate_unknown: false
      inflate_around_unknown: true
/pylon/mun_rover/local_costmap/local_costmap:
  ros__parameters:
    global_frame: pylon_rover_odom
    robot_base_frame: pylon_rover_base_footprint
    update_frequency: 5.0
    publish_frequency: 2.0
    rolling_window: true
    resolution: 0.25
    robot_radius: 6.0
    footprint_padding: 0.0
    transform_tolerance: 0.5
    track_unknown_space: true
    always_send_full_costmap: true
    plugins:
    - static_layer
    - inflation_layer
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /pylon/mun_rover/map
      map_subscribe_transient_local: true
      subscribe_to_updates: false
      track_unknown_space: true
      trinary_costmap: true
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 10.0
      cost_scaling_factor: 2.0
      inflate_unknown: false
      inflate_around_unknown: true
    width: 30
    height: 30
