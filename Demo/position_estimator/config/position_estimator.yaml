position_estimator:
  ros__parameters:
    # VAB/SPHで設定した3D LiDARのSensor IDに合わせる。
    lidar_sensor_id: front_lidar
    vessel_topic_prefix: /ksp_vessel
    # 空のままなら vessel_topic_prefix + lidar_sensor_id から自動解決する。
    lidar_topic: ""
    odom_topic: /ksp_position_estimator/odom
    status_topic: /ksp_position_estimator/status
    error_topic: /ksp_position_estimator/error

    # 真値TF (ground_truth_enu -> base_link) と競合しない独立ツリーを使う。
    odom_frame: lidar_odom_3d
    base_frame: estimator_base_link
    publish_tf: true

    # 推定の採点専用にGround Truthを購読する。推定自体には使わない。
    # 空のままなら vessel_topic_prefix から自動解決する。
    pose_topic: ""
    evaluate: true
    ground_truth_timeout_sec: 0.5
    ground_truth_buffer_size: 120
    console_echo_period_sec: 2.0

    # 点群の前処理。
    voxel_size: 0.4
    max_points: 800
    min_range: 1.0
    max_range: 120.0

    # scan-to-scan ICP 6DoF。
    max_iterations: 25
    max_correspondence_distance: 1.5
    trim_fraction: 0.8
    minimum_correspondences: 30
    convergence_tolerance: 0.0001

    # 誤対応をodometryへ混ぜないための棄却条件。
    max_rmse: 0.6
    max_translation_per_scan: 3.0
    max_rotation_per_scan_deg: 30.0
