PART
{
    name = pylon_star_tracker
    module = Part
    author = PyLoN
    MODEL
    {
        model = PyLoN/Models/StarTracker/model
    }
    rescaleFactor = 1
    node_attach = 0, 0, 0, 0, 0, -1, 0
    attachRules = 0,1,0,0,0
    TechRequired = start
    entryCost = 0
    cost = 1800
    category = Utility
    subcategory = 0
    title = PyLoN Star Tracker
    manufacturer = PyLoN
    description = A baffled optical attitude sensor. Point the open end into clear space, away from the Sun and planetary limbs. Publishes inertial vessel attitude and an explicit validity state over ROS2. Cannot determine position. Requires ElectricCharge and two seconds to acquire a lock.
    mass = 0.008
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 8
    maxTemp = 1200
    PhysicsSignificance = 1
    bulkheadProfiles = srf
    tags = star tracker attitude orientation optical sensor ros ros2 space
    MODULE
    {
        name = ModulePyLoNSensorId
        sensorKind = star_tracker
    }
    MODULE
    {
        name = ModulePyLoNStarTracker
        trackerEnabled = true
        sampleRateHz = 5
        fieldOfViewDegrees = 20
        sunExclusionDegrees = 35
        bodyLimbMarginDegrees = 5
        maxAngularRateDegrees = 2
        acquisitionSeconds = 2
        noiseArcsec = 20
        electricChargePerSecond = 0.05


    }
}
