PART
{
    name = pylon_lidar_2d
    module = Part
    author = PyLoN

    MODEL
    {
        model = PyLoN/Models/Lidar2D/model
    }

    rescaleFactor = 1
    // Blender mount is offset to preserve attachment positions in saved craft.
    node_attach = 0.0, 0.0, -0.101, 0.0, 0.0, 1.0, 0
    attachRules = 0,1,0,0,0

    TechRequired = start
    entryCost = 0
    cost = 450
    category = Utility
    subcategory = 0
    title = PyLoN LiDAR 2D
    manufacturer = PyLoN
    description = A compact surface-mounted 2D LiDAR sensor that sends scan ranges over UDP.

    mass = 0.015
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 7
    maxTemp = 1200
    PhysicsSignificance = 1
    bulkheadProfiles = srf
    tags = lidar LiDAR pylon laser range scanner sensor scan ros ros2 udp utility

    MODULE
    {
        name = ModulePyLoNSensorId
        sensorKind = lidar_2d
    }

    MODULE
    {
        name = ModulePyLoNLidar
        sensorMode = 2D

        horizontalLaserCount = 180
        horizontalFovDegrees = 360
        verticalLaserCount = 1
        verticalFovDegrees = 0
        maxDistance = 2000
        scanRateHz = 10
        maxLaserCount = 4096







        udpEnabled = true
        streamAt20Fps = false
        ignoreOwnVessel = true
        includeHitPoints = false
        includeDirections = false

        forwardAxis = -Y
        upAxis = +Z
        // Center of the planar optical window: mount -0.101 + window 0.069.
        rayOriginLocalPosition = 0, 0, -0.032
        originOffsetMeters = 0
        noHitValue = -1
        maxDatagramBytes = 60000

    }

}
