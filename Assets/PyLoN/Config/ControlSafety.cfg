// Final safety boundary for the formal ROS2 Body Wrench API.
// Units are SI. These limits apply inside KSP after lease validation and
// cannot be bypassed by a ROS-side controller parameter.
PYLON_CONTROL
{
    maxForceN = 250000
    maxTorqueNm = 100000
    maxAngularSpeedRadSec = 0.35
    maxForceSlewNPerSec = 50000
    maxTorqueSlewNmPerSec = 10000
    maxContinuousActuationSec = 30
    continuousResetIdleSec = 0.5
}
