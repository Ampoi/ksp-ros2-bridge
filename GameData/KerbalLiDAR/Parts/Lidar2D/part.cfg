PART
{
    name = kerbal_lidar_2d
    module = Part
    author = Kerbal LiDAR Lab

    MODEL
    {
        model = Squad/Parts/Science/sensorAccelerometer/model
        scale = 0.6, 0.6, 0.6
    }

    rescaleFactor = 1
    // The custom OBJ spans approximately z=-0.101..+0.101 m after scaling.
    // Put its rear face on the vessel surface instead of burying its center.
    node_attach = 0.0, 0.0, -0.101, 0.0, 0.0, 1.0, 0
    attachRules = 0,1,0,0,0

    TechRequired = start
    entryCost = 0
    cost = 450
    category = Utility
    subcategory = 0
    title = Kerbal LiDAR 2D
    manufacturer = Kerbal LiDAR Lab
    description = A compact surface-mounted 2D LiDAR sensor that sends scan ranges over UDP.

    mass = 0.015
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 7
    maxTemp = 1200
    PhysicsSignificance = 1
    bulkheadProfiles = srf
    tags = lidar LiDAR kerballidar laser range scanner sensor scan ros ros2 udp utility

    MODULE
    {
        name = ModuleKerbalRosSensorId
        sensorKind = lidar
    }

    MODULE
    {
        name = ModuleKerbalLidar
        sensorMode = 2D

        horizontalLaserCount = 180
        horizontalFovDegrees = 360
        verticalLaserCount = 1
        verticalFovDegrees = 0
        maxDistance = 2000
        scanRateHz = 10
        maxLaserCount = 4096

        udpHost = 127.0.0.1
        udpPort = 49010
        partName =
        activeVesselUrdfEnabled = true
        activeVesselUrdfRefreshSeconds = 2
        activeVesselUrdfChunkBytes = 12000
        maxActiveVesselUrdfChunks = 256
        allowRemoteUrdf = false
        udpEnabled = true
        streamAt20Fps = false
        ignoreOwnVessel = true
        includeHitPoints = false
        includeDirections = false

        forwardAxis = -Y
        upAxis = +Z
        rayOriginLocalPosition = 0, 0, 0.101
        originOffsetMeters = 0
        noHitValue = -1
        maxDatagramBytes = 60000

        visualModelObjPath = GameData/KerbalLiDAR/Models/Lidar3D/meshy_lidar_3d.obj
        visualModelTexturePath = GameData/KerbalLiDAR/Models/Lidar3D/meshy_lidar_3d.png
        visualModelScale = 0.12
        visualModelPosition = 0, 0, 0
        visualModelRotation = 0, 0, 0
        visualModelDoubleSided = true
    }

}
