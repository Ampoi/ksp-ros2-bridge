PART
{
    name = kerbal_ros_servo_size0
    module = Part
    author = Kerbal LiDAR Lab

    MODEL
    {
        model = Squad/Parts/FuelTank/RCSFuelTankR10/model
    }

    rescaleFactor = 1
    node_stack_top = 0.0, 0.3349114, 0.0, 0.0, 1.0, 0.0, 0
    node_stack_bottom = 0.0, -0.1875, 0.0, 0.0, -1.0, 0.0, 0
    attachRules = 1,0,1,1,0

    TechRequired = electrics
    entryCost = 3000
    cost = 850
    category = Utility
    subcategory = 0
    title = ROS2 Size-0 Axial Servo
    manufacturer = Kerbal LiDAR Lab
    description = A compact cylindrical position servo with stack nodes on both faces. Its 0.625 m body matches the Clamp-O-Tron Jr. and accepts standard ROS2 joint commands through the Kerbal bridge.

    mass = 0.065
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 18
    breakingForce = 80
    breakingTorque = 80
    maxTemp = 1800
    bulkheadProfiles = size0
    tags = ros ros2 robot robotic motor servo rotate rotation axial size0 actuator utility

    MODULE
    {
        name = ModuleKerbalRosServo

        servoName = ROS2 Axial Servo
        servoTransformName = motorMoving
        baseTransformName = motorBase
        servoAttachNodes = top
        mainAxis = Y

        useLimits = true
        allowFullRotation = false
        hardMinMaxLimits = -180, 180
        softMinMaxAngles = -180, 180
        targetAngle = 0
        traverseVelocityLimits = 1, 60
        traverseVelocity = 45
        hingeDamping = 100
        angularXLimitSpring = 100000
        angularXLimitDamper = 100
        driveSpringMutliplier = 100
        driveDampingMutliplier = 20

        servoIsMotorized = true
        servoMotorIsEngaged = true
        servoIsLocked = false
        servoMotorSize = 100
        servoMotorLimit = 100
        maxMotorOutput = 0.25
        servoMass = 0.065
        motorizedMassPerKN = 0.0001
        motorizedCostPerDriveUnit = 1
        connectedMassScale = 1
        efficiency = 0.78
        baseResourceConsumptionRate = 0.02
        referenceConsumptionVelocity = 45
        lockPartOnPowerLoss = true

        motorName =
        commandUdpPort = 49011
        stateUdpHost = 127.0.0.1
        stateUdpPort = 49010
        stateRateHz = 20
        commandTimeoutSeconds = 0.5
        ratedEffortNm = 250
        torquePerAmpNm = 40

        movingModelPath = Squad/Parts/Utility/dockingPortJr/dockingPortJr
        movingModelPosition = 0, 0.1875, 0
        movingModelRotation = 0, 0, 0
        movingModelScale = 1, 1, 1

        RESOURCE
        {
            name = ElectricCharge
            rate = 1
        }
    }
}
