PART
{
    name = kerbal_lidar_3d
    module = Part
    author = Kerbal LiDAR Lab

    MODEL
    {
        model = KerbalLiDAR/Models/Lidar3D/model
    }

    rescaleFactor = 1
    // Blender mount is offset to preserve attachment positions in saved craft.
    node_attach = 0.0, 0.0, -0.120, 0.0, 0.0, 1.0, 0
    attachRules = 0,1,0,0,0

    TechRequired = start
    entryCost = 0
    cost = 1600
    category = Utility
    subcategory = 0
    title = Kerbal LiDAR 3D
    manufacturer = Kerbal LiDAR Lab
    description = A surface-mounted 3D LiDAR sensor that samples a forward hemisphere and sends scan ranges over UDP.

    mass = 0.03
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 7
    maxTemp = 1200
    PhysicsSignificance = 1
    bulkheadProfiles = srf
    tags = lidar LiDAR kerballidar laser range scanner sensor scan ros ros2 udp utility 3d

    MODULE
    {
        name = ModuleKerbalRosSensorId
        sensorKind = lidar_3d
    }

    MODULE
    {
        name = ModuleKerbalLidar
        sensorMode = 3D

        horizontalLaserCount = 180
        horizontalFovDegrees = 360
        verticalLaserCount = 1
        verticalFovDegrees = 180
        rangeProfile = medium
        nearRangeMeters = 30
        mediumRangeMeters = 100
        longRangeMeters = 250
        hemisphereDensity = 320
        maxDistance = 100
        scanRateHz = 10
        maxLaserCount = 4096

        udpHost = 127.0.0.1
        udpPort = 49010
        activeVesselUrdfEnabled = true
        activeVesselUrdfRefreshSeconds = 2
        activeVesselUrdfChunkBytes = 12000
        maxActiveVesselUrdfChunks = 256
        allowRemoteUrdf = false
        udpEnabled = true
        streamAt20Fps = false
        ignoreOwnVessel = true
        includeHitPoints = false
        includeDirections = false

        forwardAxis = +Z
        align3DToAttachNormal = true
        upAxis = +Y
        // 2 mm above the dome apex; scan retains the existing outward hemisphere.
        rayOriginLocalPosition = 0, 0, 0.059
        originOffsetMeters = 0
        noHitValue = -1
        maxDatagramBytes = 60000

        iridescentTransformName = IridescentDome
    }

}
