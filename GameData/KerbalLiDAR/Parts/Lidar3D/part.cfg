PART
{
    name = kerbal_lidar_3d
    module = Part
    author = Kerbal LiDAR Lab

    MODEL
    {
        model = Squad/Parts/Science/sensorGravimeter/model
        scale = 0.55, 0.55, 0.55
    }

    rescaleFactor = 1
    node_attach = 0.0, 0.0, -0.05, 0.0, 0.0, -1.0, 0
    attachRules = 0,1,0,0,0

    TechRequired = start
    entryCost = 0
    cost = 1600
    category = Utility
    subcategory = 0
    title = Kerbal LiDAR 3D
    manufacturer = Kerbal LiDAR Lab
    description = A surface-mounted 3D LiDAR sensor that samples a forward hemisphere and sends scan ranges over UDP.

    mass = 0.03
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 7
    maxTemp = 1200
    PhysicsSignificance = 1
    bulkheadProfiles = srf
    tags = lidar LiDAR kerballidar laser range scanner sensor scan ros ros2 udp utility 3d

    MODULE
    {
        name = ModuleKerbalLidar
        sensorMode = 3D

        horizontalLaserCount = 180
        horizontalFovDegrees = 360
        verticalLaserCount = 1
        verticalFovDegrees = 180
        hemisphereDensity = 160
        maxDistance = 2000
        scanRateHz = 10
        maxLaserCount = 4096

        udpHost = 127.0.0.1
        udpPort = 49010
        partName =
        activeVesselUrdfEnabled = true
        activeVesselUrdfRefreshSeconds = 2
        activeVesselUrdfChunkBytes = 12000
        maxActiveVesselUrdfChunks = 256
        allowRemoteUrdf = false
        udpEnabled = true
        streamAt20Fps = false
        ignoreOwnVessel = true
        includeHitPoints = false
        includeDirections = true

        forwardAxis = -Y
        upAxis = +Z
        originOffsetMeters = 0.05
        noHitValue = -1
        maxDatagramBytes = 60000

        visualModelObjPath = GameData/KerbalLiDAR/Models/Lidar2D/meshy_lidar_2d.obj
        visualModelTexturePath = GameData/KerbalLiDAR/Models/Lidar2D/meshy_lidar_2d.png
        visualModelScale = 0.12
        visualModelPosition = 0, 0, 0
        visualModelRotation = 0, 0, 0
        visualModelDoubleSided = true
    }
}
