PART
{
    name = kerbal_ros_linear_motor_size0
    module = Part
    author = Kerbal LiDAR Lab

    MODEL
    {
        model = Squad/Parts/FuelTank/RCSFuelTankR10/model
    }

    rescaleFactor = 1
    node_stack_top = 0.0, 0.3349114, 0.0, 0.0, 1.0, 0.0, 0
    node_stack_bottom = 0.0, -0.1875, 0.0, 0.0, -1.0, 0.0, 0
    attachRules = 1,0,1,1,0

    TechRequired = electrics
    entryCost = 3600
    cost = 950
    category = Utility
    subcategory = 0
    title = ROS2 Size-0 Linear Motor
    manufacturer = Kerbal LiDAR Lab
    description = A stack-mounted electric linear actuator with 1.5 m of axial travel. Parts attached to its top node move with the piston and can be commanded from standard ROS2 joint messages.

    mass = 0.075
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 18
    breakingForce = 80
    breakingTorque = 80
    maxTemp = 1800
    bulkheadProfiles = size0
    tags = ros ros2 robot robotic motor linear piston extend actuator size0 utility

    MODULE
    {
        name = ModuleKerbalRosLinearMotor

        servoName = ROS2 Linear Motor
        servoTransformName = motorMoving
        baseTransformName = motorBase
        servoAttachNodes = top
        mainAxis = Y

        useLimits = true
        hardMinMaxLimits = 0, 1.5
        softMinMaxExtension = 0, 1.5
        targetExtension = 0
        traverseVelocityLimits = 0.02, 0.35
        traverseVelocity = 0.25
        pistonDamping = 100
        linearLimitBounce = 0
        linearLimitSpringSpring = 100000
        linearLimitSpringDamper = 100
        positionSpringMutliplier = 100
        positionDampingMutliplier = 20

        servoIsMotorized = true
        servoMotorIsEngaged = true
        servoIsLocked = false
        servoMotorSize = 100
        servoMotorLimit = 100
        maxMotorOutput = 4
        servoMass = 0.075
        motorizedMassPerKN = 0.0001
        motorizedCostPerDriveUnit = 1
        connectedMassScale = 1
        efficiency = 0.75
        baseResourceConsumptionRate = 0.03
        referenceConsumptionVelocity = 0.25
        lockPartOnPowerLoss = true

        motorName =
        commandUdpPort = 49011
        stateUdpHost = 127.0.0.1
        stateUdpPort = 49010
        stateRateHz = 20
        commandTimeoutSeconds = 0.5
        ratedEffortN = 4000
        forcePerAmpN = 800

        movingModelPath = Squad/Parts/Utility/dockingPortJr/dockingPortJr
        movingModelPosition = 0, 0.1875, 0
        movingModelRotation = 0, 0, 0
        movingModelScale = 1, 1, 1

        RESOURCE
        {
            name = ElectricCharge
            rate = 1
        }
    }
}
