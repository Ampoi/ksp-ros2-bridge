PART
{
    name = kerbal_rgb_camera
    module = Part
    author = Kerbal LiDAR Lab

    MODEL
    {
        model = Squad/Parts/Utility/spotLightMk1_v2/model
        scale = 0.45, 0.45, 0.45
    }

    rescaleFactor = 1
    node_attach = 0.0, 0.0055, 0.096, 0.0, 0.0, -1.0, 0
    attachRules = 0,1,0,0,1

    TechRequired = start
    entryCost = 0
    cost = 600
    category = Utility
    subcategory = 0
    title = Kerbal ROS2 RGB Camera
    manufacturer = Kerbal LiDAR Lab
    description = A surface-mounted RGB camera that streams standard ROS2 Image and CameraInfo messages through the UDP bridge.

    mass = 0.015
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 8
    maxTemp = 1200
    PhysicsSignificance = 1
    bulkheadProfiles = srf
    tags = camera rgb image vision optical sensor ros ros2 udp utility

    MODULE
    {
        name = ModuleKerbalRosSensorId
        sensorKind = camera
    }

    MODULE
    {
        name = ModuleKerbalRgbCamera

        imageWidth = 320
        imageHeight = 240
        frameRateHz = 5
        verticalFovDegrees = 60
        nearClipMeters = 0.05
        farClipMeters = 20000

        udpHost = 127.0.0.1
        udpPort = 49010
        frameChunkBytes = 12000
        maxFrameBytes = 4194304
        maxFrameChunks = 512
        partName =
        cameraEnabled = true
        udpEnabled = true

        cameraOriginLocalPosition = 0, 0, -0.2
        forwardAxis = -Z
        upAxis = +Y
    }

}
